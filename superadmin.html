<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSPIM MARKET - Terminal Maestro Super Admin SaaS</title>
    <meta name="description" content="Terminal independiente de gestión SaaS, control de tenants y suscripciones de SYSPIM MARKET.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.ico">

    <!-- Anti-Gravity Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Outfit:wght@100;200;300;700;800;900&family=Space+Grotesk:wght@300;500;700;900&family=JetBrains+Mono:wght@400;700;800&family=Plus+Jakarta+Sans:wght@200;300;700;800&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- SUPABASE JS CLIENT CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CONFIGURACIÓN Y UTILIDADES -->
    <script type="module" src="/src/config/supabase.js"></script>
    <script type="module" src="/src/utils/helpers.js"></script>

    <!-- MÓDULO SUPER ADMIN SAAS -->
    <script type="module" src="/src/modules/superadmin/superadmin.js"></script>
</head>
<body class="bg-[#F8FAFC] text-[#0F172A] font-jakarta min-h-screen antialiased selection:bg-[#E0F2FE] selection:text-[#0284C7]">

    <!-- CONTENEDOR PRINCIPAL DE LA TERMINAL INDEPENDIENTE SAAS -->
    <main class="max-w-7xl mx-auto p-4 lg:p-8">
        <div id="superadmin-root" class="w-full"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.SuperAdminModule && window.SuperAdminModule.initSuperAdminModule) {
                window.SuperAdminModule.initSuperAdminModule('superadmin-root');
            }
        });
    </script>
</body>
</html>
